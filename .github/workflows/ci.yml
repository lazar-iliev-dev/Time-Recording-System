name: CI

on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    steps:
      # --- Checkout sources ---
      - name: Checkout code
        uses: actions/checkout@v4

      # --- Setup Python ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --- Install PostgreSQL manually (for act + GA stability) ---
      - name: Start PostgreSQL (manual, stable)
        run: |
          docker run -d \
            --name test-postgres \
            -e POSTGRES_USER=test \
            -e POSTGRES_PASSWORD=test \
            -e POSTGRES_DB=testdb \
            -p 5432:5432 \
            postgres:15

      # --- Wait for DB to be ready ---
      - name: Wait for PostgreSQL
        run: |
          echo "Waiting for postgres to become ready..."
          for i in {1..40}; do
            if docker exec test-postgres pg_isready -U test -d testdb > /dev/null 2>&1; then
              echo "Postgres is ready!"
              exit 0
            fi
            echo "Still waiting..."
            sleep 2
          done
          echo "Postgres did NOT become ready in time"
          docker logs test-postgres
          exit 1

      # --- Configure DATABASE_URL for backend ---
      - name: Export DB URL
        run: |
          echo "DATABASE_URL=postgresql://test:test@localhost:5432/testdb" >> $GITHUB_ENV

      # --- Install backend dependencies ---
      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      # --- Run migrations ---
      - name: Run database migrations
        run: |
          cd backend
          alembic upgrade head

      # --- Run backend tests ---
      - name: Run backend tests
        run: |
          cd backend
          pytest --maxfail=1 --disable-warnings -q

      # --- Cleanup (important for act & local disk) ---
      - name: Stop and remove PostgreSQL container
        if: always()
        run: |
          docker stop test-postgres || true
          docker rm test-postgres || true

  frontend-lint:
    runs-on: ubuntu-latest

    steps:
      # --- Checkout ---
      - name: Checkout code
        uses: actions/checkout@v4

      # --- Node setup ---
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      # --- Install frontend dependencies ---
      - name: Install frontend deps
        run: |
          cd frontend
          npm install

      # --- Run linting ---
      - name: Run ESLint
        run: |
          cd frontend
          npm run lint
