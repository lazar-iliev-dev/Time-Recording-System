name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    name: Lint & check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend deps
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt

      - name: Run backend lint (flake8)
        run: |
          pip install flake8 || true
          flake8 backend || true

      - name: Frontend lint
        run: |
          cd frontend
          npm ci
          npm run lint --if-present || true

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d testdb" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install backend deps
        run: pip install -r backend/requirements.txt

      - name: Run backend tests
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/testdb
          EDGE_SECRET: supersecret
        run: |
          cd backend
          pytest -q

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & run frontend tests
        run: |
          cd frontend
          npm ci
          npm test --if-present

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        options: >-
          --health-cmd "pg_isready -U test -d testdb" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build images
        run: |
          docker compose build --no-cache backend frontend edge-sim

      - name: Start services
        run: |
          # start db first, then the rest
          docker compose up -d db
          docker compose up -d backend frontend edge-sim
          sleep 5

      - name: Wait for backend to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sSf http://localhost:8000/health >/dev/null 2>&1; then
              echo "backend ready"
              break
            fi
            echo "waiting for backend..."
            sleep 1
          done

      - name: Run Playwright tests
        run: |
          cd e2e
          npx playwright install --with-deps
          npx playwright test --reporter=github
